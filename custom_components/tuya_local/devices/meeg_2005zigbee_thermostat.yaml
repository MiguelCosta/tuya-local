name: Floor heating thermostat
products:
  - id: axacnt9a
    manufacturer: Meeg
    model: 2005 Zigbee
entities:
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode_selection
            conditions:
              - dps_val: heat
                value: heat
              - dps_val: cool
                value: cool
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: manual
            value: manual
          - dps_val: schedule
            value: program
      - id: 16
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 18
        type: integer
        optional: true
        name: min_temperature
        mapping:
          - scale: 10
      - id: 34
        type: integer
        name: max_temperature
        mapping:
          - scale: 10
      - id: 47
        type: string
        name: hvac_action
        mapping:
          - dps_val: close
            value: idle
          - dps_val: open
            constraint: mode_selection
            conditions:
              - dps_val: heat
                value: heating
              - dps_val: cool
                value: cooling
      - id: 50
        type: integer
        name: temperature
        unit: C
        range:
          min: 50
          max: 450
        mapping:
          - scale: 10
            step: 5
      - id: 115
        type: string
        name: mode_selection
        hidden: true
      - id: 116
        type: integer
        name: current_humidity
  - entity: number
    translation_key: minimum_temperature
    class: temperature
    category: config
    dps:
      - id: 18
        type: integer
        optional: true
        name: value
        unit: C
        range:
          min: 50
          max: 150
        mapping:
          - scale: 10
            step: 10
  - entity: number
    translation_key: maximum_temperature
    class: temperature
    category: config
    dps:
      - id: 34
        type: integer
        name: value
        unit: C
        range:
          min: 150
          max: 450
        mapping:
          - scale: 10
            step: 10
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 19
        type: integer
        optional: true
        name: value
        unit: C
        range:
          min: -14
          max: 14
  - entity: button
    translation_key: factory_reset
    category: config
    hidden: true
    dps:
      - id: 28
        type: boolean
        optional: true
        name: button
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 39
        type: boolean
        optional: true
        name: lock
  - entity: switch
    name: Eco mode
    icon: "mdi:leaf"
    category: config
    dps:
      - id: 40
        type: boolean
        name: switch
  - entity: number
    name: Temperature hysteresis
    class: temperature_delta
    icon: "mdi:arrow-expand-vertical"
    category: config
    dps:
      - id: 108
        type: integer
        optional: true
        name: value
        unit: C
        range:
          min: 1
          max: 5
  - entity: number
    name: Eco heat temperature
    class: temperature
    category: config
    dps:
      - id: 109
        type: integer
        optional: true
        name: value
        unit: C
        range:
          min: 0
          max: 300
        mapping:
          - scale: 10
            step: 10
  - entity: select
    name: Sensor selection
    icon: "mdi:thermometer-check"
    category: config
    dps:
      - id: 110
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: in
            value: internal
          - dps_val: ou
            value: external
          - dps_val: al
            value: both
  - entity: number
    name: High temperature protection
    class: temperature
    icon: "mdi:thermometer-alert"
    category: config
    dps:
      - id: 111
        type: integer
        optional: true
        name: value
        unit: C
        range:
          min: 100
          max: 700
        mapping:
          - scale: 10
            step: 10
  - entity: number
    name: Standby brightness
    icon: "mdi:brightness-6"
    category: config
    dps:
      - id: 112
        type: integer
        name: value
        range:
          min: 0
          max: 10
  - entity: number
    name: Low temperature protection
    class: temperature
    icon: "mdi:snowflake-thermometer"
    category: config
    dps:
      - id: 113
        type: integer
        optional: true
        name: value
        unit: C
        range:
          min: 0
          max: 100
        mapping:
          - scale: 10
            step: 10
  - entity: sensor
    class: temperature
    dps:
      - id: 16
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: humidity
    dps:
      - id: 116
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: binary_sensor
    name: Valve
    class: opening
    icon: "mdi:valve"
    dps:
      - id: 47
        type: string
        name: sensor
        mapping:
          - dps_val: open
            value: true
          - dps_val: close
            value: false
  - entity: sensor
    name: Floor temperature
    class: temperature
    dps:
      - id: 114
        type: integer
        optional: true
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: number
    name: Humidity calibration
    icon: "mdi:water-percent"
    category: config
    dps:
      - id: 117
        type: integer
        optional: true
        name: value
        unit: "%"
        range:
          min: -10
          max: 10
